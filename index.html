    <!-- Open Graph requires an ABSOLUTE url. Scrapers (Slack, iMessage, X,
         Facebook) fetch the page without a base and silently drop a relative
         one, so the preview renders with no image. %VITE_SITE_URL% is
         substituted at build time — see .env for the default, and override it
         as a Railway build variable if the domain changes. -->
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/clips/gym-stand.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/clips/gym-stand.jpg" />
